[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "whatisit"
version = "0.3.0"
description = "Natural language to shell command. Runs on your own machine by default, on CPU. No GPU, no API key, no network."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "ThorOdinson246", email = "110178596+ThorOdinson246@users.noreply.github.com" }]
keywords = ["shell", "cli", "llm", "local", "local-first", "privacy", "bash",
            "command-generation", "llama-cpp", "offline", "openai", "whatisit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Shells",
  "Topic :: Utilities",
]
# Deliberately zero runtime dependencies: stdlib urllib talks to the local
# server, so `pip install whatisit` cannot break someone's environment.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5", "build>=1"]

[project.urls]
Homepage = "https://github.com/ThorOdinson246/whatisit-nl2sh"
Repository = "https://github.com/ThorOdinson246/whatisit-nl2sh"
Issues = "https://github.com/ThorOdinson246/whatisit-nl2sh/issues"
Model = "https://huggingface.co/ThorOdinson246/nl2sh-1.5b-Q4_K_M"

[project.scripts]
whatisit = "whatisit.cli:main"

[tool.setuptools]
# Apache-2.0 requires the NOTICE to travel with every redistribution.
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
include = ["whatisit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]
ignore = [
  "E731",  # lambda assignments -- cli.py uses them deliberately for the
           # colour helpers (BOLD/DIM/RED/...); not worth a refactor here.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # test_safety.py needs sys.path.insert before its import
# test_safety.py is the crown-jewel regression file: every entry is a
# confirmed bypass or false positive from four adversarial audits. Its
# content (including these literal '\;' find(1) strings and long inline
# comments) is deliberately left untouched rather than reformatted.
"tests/test_safety.py" = ["E402", "E501", "W605"]
